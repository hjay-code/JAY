spring:
  application:
    name: cli

  ai:
    model:
      embedding: openai
    vectorstore:
      redis:
        initialize-schema: true # 是否在启动时创建/初始化向量索引等结构
        index-name: java_ai_vector_index_ # RedisSearch 的索引名
        prefix: "java_ai_" # 存向量文档的 Redis 前缀
    openai:
      api-key: ${OPEN_AI_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3.8-flash
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          dimensions: 2048 # 向量维度

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:1.7b

    mcp:
      client:
        stdio:
          servers-configuration: classpath:/mcp/mcp-servers-config.json


logging:
  threshold:
    console: DEBUG
  level:
    org.springframework.ai: debug

# 技能目录（可选）：额外的本地技能根目录，其下每个子目录放一个 SKILL.md
# 留空则只加载 classpath:/skills；绝对路径，例如 D:/skills
app:
  skills:
    dir: