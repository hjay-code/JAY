mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hjay.entity

server:
  port: 8080
  servlet:
    context-path: /im_bird_sys

spring:
  thymeleaf:
    cache: true
    check-template: true
    check-template-location: true
    servlet:
      content-type: text/html
    enabled: true
    encoding: utf-8
    excluded-view-names:
    mode: HTML5
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    name: im_bird_sys
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql:///im_bird_sys
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    dbcp2:
      initial-size: 2
      max-idle: 10
      min-idle: 1
      validation-query: SELECT 'x' # 连接是有效的sql，不用的数据配置不同
      # 指明连接是否被空闲连接器回收进行检验，检测失败则从连接池中移除
      test-while-idle: true
      # 借出连接时不要进行测试，否则影响性能
      test-on-borrow: false

# ===================================================================
# 分布式文件系统FDFS配置
# ===================================================================
fdfs:
  so-timeout: 1501
  connect-timeout: 601
  thumb-image:             #缩略图生成参数
    width: 150
    height: 150
  tracker-list:            #TrackerList参数,支持多个
    - 1.94.44.183:22122